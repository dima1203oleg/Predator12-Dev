<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Predator AI Platform - Потужна платформа для роботи з AI моделями" />
    <meta name="theme-color" content="#667eea" />
    <title>🚀 Predator AI Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background: radial-gradient(ellipse at center, #1a1d2e 0%, #0f121a 50%, #000000 100%);
        color: #f0f8ff;
        min-height: 100vh;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading animation */
      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #00ffc6;
        text-align: center;
        animation: nexus-glow 2s ease-in-out infinite;
        text-shadow: 0 0 20px #00ffc6;
      }

      .loading::before {
        content: '';
        position: absolute;
        top: -50px;
        left: 50%;
        transform: translateX(-50%);
        width: 60px;
        height: 60px;
        border: 3px solid rgba(0, 255, 198, 0.3);
        border-top: 3px solid #00ffc6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes nexus-glow {
        0%, 100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
          text-shadow: 0 0 20px #00ffc6;
        }
        50% {
          opacity: 0.7;
          transform: translate(-50%, -50%) scale(1.05);
          text-shadow: 0 0 30px #a020f0;
        }
      }

      @keyframes spin {
        0% { transform: translateX(-50%) rotate(0deg); }
        100% { transform: translateX(-50%) rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">🎮 NEXUS CORE V3 INITIALIZING...</div>
    </div>
  <script type="module" src="/src/main-test.tsx"></script>
  </body>
</html>
