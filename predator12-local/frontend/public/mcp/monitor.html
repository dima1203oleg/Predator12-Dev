<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моніторинг Лімітів Моделей</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .tabs {
            display: flex;
            background: #f8fafc;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab {
            flex: 1;
            background: none;
            border: none;
            padding: 20px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab:hover {
            background: #e2e8f0;
        }

        .tab.active {
            background: white;
            border-bottom-color: #4f46e5;
            font-weight: bold;
            color: #4f46e5;
        }

        .content {
            padding: 40px;
            min-height: 600px;
        }

        .recommendation-form {
            background: #f8fafc;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 2px solid #e2e8f0;
        }

        .form-row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        select, input, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .btn {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .recommendations {
            margin-top: 30px;
        }

        .model-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .model-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .model-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .model-score {
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .model-specs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .spec {
            text-align: center;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }

        .spec-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #4f46e5;
        }

        .spec-label {
            font-size: 0.9em;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .context-checker {
            background: #f0f9ff;
            border: 2px solid #0ea5e9;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .context-result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Monaco', 'Menlo', monospace;
        }

        .context-ok {
            background: #dcfce7;
            border: 2px solid #16a34a;
            color: #166534;
        }

        .context-warning {
            background: #fef3c7;
            border: 2px solid #d97706;
            color: #92400e;
        }

        .context-error {
            background: #fee2e2;
            border: 2px solid #dc2626;
            color: #991b1b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .stat-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #1f2937;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6b7280;
            font-size: 1.2em;
        }

        .loading::after {
            content: "⏳";
            animation: spin 2s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #dc2626;
            margin: 20px 0;
        }

        .model-tasks {
            margin-top: 15px;
        }

        .task-tag {
            background: #e0e7ff;
            color: #3730a3;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            margin: 2px;
            display: inline-block;
        }

        .performance-meter {
            background: #f3f4f6;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .performance-bar {
            height: 100%;
            background: linear-gradient(90deg, #dc2626, #f59e0b, #10b981);
            transition: width 0.5s ease;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }

            .tabs {
                flex-direction: column;
            }

            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Моніторинг Лімітів Моделей</h1>
            <p>Аналіз продуктивності та рекомендації для оптимального використання</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('recommendations')">🎯 Рекомендації</button>
            <button class="tab" onclick="switchTab('context')">📖 Перевірка Контексту</button>
            <button class="tab" onclick="switchTab('stats')">📈 Статистика</button>
        </div>

        <div class="content">
            <!-- Recommendations Tab -->
            <div id="recommendations" class="tab-content active">
                <div class="recommendation-form">
                    <h2>🔍 Знайти Найкращу Модель</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="speed">Швидкість</label>
                            <select id="speed">
                                <option value="medium">Середня</option>
                                <option value="high">Висока</option>
                                <option value="low">Низька</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="quality">Якість</label>
                            <select id="quality">
                                <option value="medium">Середня</option>
                                <option value="high">Висока</option>
                                <option value="low">Низька</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="contextSize">Розмір Контексту</label>
                            <select id="contextSize">
                                <option value="medium">Середній</option>
                                <option value="large">Великий</option>
                                <option value="small">Малий</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="cost">Вартість</label>
                            <select id="cost">
                                <option value="medium">Середня</option>
                                <option value="low">Низька</option>
                                <option value="high">Висока</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="task">Тип Завдання</label>
                            <select id="task">
                                <option value="general">Загальне</option>
                                <option value="quick">Швидке</option>
                                <option value="complex">Складне</option>
                                <option value="long-context">Довгий контекст</option>
                                <option value="vision">Зображення</option>
                                <option value="budget">Економне</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <button class="btn" onclick="getRecommendations()">
                                🔍 Знайти Модель
                            </button>
                        </div>
                    </div>
                </div>

                <div id="recommendationResults" class="recommendations"></div>
            </div>

            <!-- Context Checker Tab -->
            <div id="context" class="tab-content">
                <div class="context-checker">
                    <h2>📖 Перевірка Лімітів Контексту</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="contextModel">Модель</label>
                            <select id="contextModel">
                                <option value="gpt-4o">GPT-4o (128K)</option>
                                <option value="gpt-4o-mini">GPT-4o Mini (128K)</option>
                                <option value="Phi-3-mini-4k-instruct">Phi-3 Mini (4K)</option>
                                <option value="Phi-3-small-128k-instruct">Phi-3 Small (128K)</option>
                                <option value="AI21-Jamba-1.5-Large">AI21 Jamba (256K)</option>
                                <option value="Meta-Llama-3.1-405B-Instruct">Llama 405B (128K)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="contextText">Текст для Перевірки</label>
                        <textarea id="contextText" rows="8" placeholder="Введіть текст для перевірки лімітів контексту..." style="resize: vertical; height: 150px;"></textarea>
                    </div>

                    <button class="btn" onclick="checkContext()">
                        ✅ Перевірити Контекст
                    </button>

                    <div id="contextResult"></div>
                </div>
            </div>

            <!-- Stats Tab -->
            <div id="stats" class="tab-content">
                <div class="stats-section">
                    <h2>📈 Статистика Використання</h2>
                    <button class="btn" onclick="loadStats()" style="margin-bottom: 20px;">
                        🔄 Оновити Статистику
                    </button>

                    <div id="statsResults"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            // Remove active class from all tabs and content
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
                content.style.display = 'none';
            });

            // Add active class to clicked tab and show content
            event.target.classList.add('active');
            const content = document.getElementById(tabName);
            content.classList.add('active');
            content.style.display = 'block';
        }

        async function getRecommendations() {
            const requirements = {
                speed: document.getElementById('speed').value,
                quality: document.getElementById('quality').value,
                contextSize: document.getElementById('contextSize').value,
                cost: document.getElementById('cost').value,
                task: document.getElementById('task').value
            };

            const resultsDiv = document.getElementById('recommendationResults');
            resultsDiv.innerHTML = '<div class="loading">Пошук найкращих моделей...</div>';

            try {
                const response = await fetch('/v1/recommend-model', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requirements)
                });

                if (!response.ok) throw new Error('Помилка сервера');

                const data = await response.json();
                displayRecommendations(data.recommendations);

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Помилка: ${error.message}</div>`;
            }
        }

        function displayRecommendations(recommendations) {
            const resultsDiv = document.getElementById('recommendationResults');

            if (!recommendations || recommendations.length === 0) {
                resultsDiv.innerHTML = '<div class="error">❌ Рекомендацій не знайдено</div>';
                return;
            }

            let html = '<h2>🏆 Рекомендовані Моделі</h2>';

            recommendations.forEach((model, index) => {
                const rank = ['🥇', '🥈', '🥉'][index] || `${index + 1}.`;
                const scorePercent = Math.min(100, (model.score / 20) * 100);

                html += `
                    <div class="model-card">
                        <div class="model-name">${rank} ${model.name}</div>
                        <div class="model-score">Рейтинг: ${model.score}/20</div>

                        <div class="performance-meter">
                            <div class="performance-bar" style="width: ${scorePercent}%"></div>
                        </div>

                        <div class="model-specs">
                            <div class="spec">
                                <div class="spec-value">${model.speed}/5</div>
                                <div class="spec-label">Швидкість</div>
                            </div>
                            <div class="spec">
                                <div class="spec-value">${model.quality}/5</div>
                                <div class="spec-label">Якість</div>
                            </div>
                            <div class="spec">
                                <div class="spec-value">${model.context}/5</div>
                                <div class="spec-label">Контекст</div>
                            </div>
                            <div class="spec">
                                <div class="spec-value">${model.cost}/5</div>
                                <div class="spec-label">Економність</div>
                            </div>
                        </div>

                        <div class="model-tasks">
                            <strong>Підходить для:</strong>
                            ${model.tasks.map(task => `<span class="task-tag">${getTaskName(task)}</span>`).join('')}
                        </div>
                    </div>
                `;
            });

            resultsDiv.innerHTML = html;
        }

        function getTaskName(task) {
            const taskNames = {
                'general': 'Загальні завдання',
                'quick': 'Швидкі запити',
                'complex': 'Складні завдання',
                'simple': 'Прості завдання',
                'long-context': 'Довгі тексти',
                'documents': 'Документи',
                'analysis': 'Аналіз',
                'vision': 'Зображення',
                'budget': 'Економні',
                'research': 'Дослідження'
            };
            return taskNames[task] || task;
        }

        async function checkContext() {
            const model = document.getElementById('contextModel').value;
            const text = document.getElementById('contextText').value;

            if (!text.trim()) {
                alert('Введіть текст для перевірки');
                return;
            }

            const resultDiv = document.getElementById('contextResult');
            resultDiv.innerHTML = '<div class="loading">Перевірка лімітів контексту...</div>';

            try {
                const response = await fetch('/v1/check-context', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model, text })
                });

                if (!response.ok) throw new Error('Помилка сервера');

                const data = await response.json();
                displayContextResult(data);

            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Помилка: ${error.message}</div>`;
            }
        }

        function displayContextResult(result) {
            const resultDiv = document.getElementById('contextResult');
            const { estimatedTokens, limit, fits, usage } = result;

            let className = 'context-ok';
            let icon = '✅';
            let message = 'Текст вміщується в ліміт контексту';

            if (usage > 80) {
                className = 'context-warning';
                icon = '⚠️';
                message = 'Близько до ліміту - рекомендується скоротити текст';
            }

            if (!fits) {
                className = 'context-error';
                icon = '❌';
                message = 'Текст перевищує ліміт контексту';
            }

            resultDiv.innerHTML = `
                <div class="context-result ${className}">
                    <h3>${icon} ${message}</h3>
                    <p><strong>Приблизна кількість токенів:</strong> ${estimatedTokens.toLocaleString()}</p>
                    <p><strong>Ліміт моделі:</strong> ${limit.toLocaleString()}</p>
                    <p><strong>Використано:</strong> ${usage}%</p>
                    ${!fits ? '<p><strong>💡 Рекомендація:</strong> Розбийте текст на частини або виберіть модель з більшим контекстом</p>' : ''}
                </div>
            `;
        }

        async function loadStats() {
            const resultsDiv = document.getElementById('statsResults');
            resultsDiv.innerHTML = '<div class="loading">Завантаження статистики...</div>';

            try {
                const response = await fetch('/v1/stats');
                if (!response.ok) throw new Error('Помилка сервера');

                const data = await response.json();
                displayStats(data);

            } catch (error) {
                resultsDiv.innerHTML = `<div class="error">❌ Помилка: ${error.message}</div>`;
            }
        }

        function displayStats(data) {
            const resultsDiv = document.getElementById('statsResults');
            const { usage, report } = data;

            let html = '<div class="stats-grid">';

            // Summary stats
            if (report.summary) {
                html += `
                    <div class="stat-card">
                        <div class="stat-title">📊 Загальна Статистика</div>
                        <div class="stat-value">${report.summary.totalModels}</div>
                        <div class="stat-label">Використовувані моделі</div>
                        <hr style="margin: 15px 0;">
                        <div>📨 Всього запитів: <strong>${report.summary.totalRequests}</strong></div>
                        <div>❌ Помилок: <strong>${report.summary.totalErrors}</strong></div>
                    </div>
                `;
            }

            html += '</div>';

            // Model stats
            if (Object.keys(usage).length > 0) {
                html += '<h3>📈 Статистика по Моделях</h3>';

                Object.entries(usage).forEach(([model, stats]) => {
                    const efficiency = stats.efficiency || 0;
                    const efficiencyColor = efficiency > 80 ? '#10b981' : efficiency > 60 ? '#f59e0b' : '#dc2626';

                    html += `
                        <div class="model-card">
                            <div class="model-name">${model}</div>

                            <div class="model-specs">
                                <div class="spec">
                                    <div class="spec-value">${stats.totalRequests}</div>
                                    <div class="spec-label">Запитів</div>
                                </div>
                                <div class="spec">
                                    <div class="spec-value">${Math.round(stats.avgResponseTime)}ms</div>
                                    <div class="spec-label">Середній час</div>
                                </div>
                                <div class="spec">
                                    <div class="spec-value">${stats.tokensPerSecond}</div>
                                    <div class="spec-label">Токенів/сек</div>
                                </div>
                                <div class="spec">
                                    <div class="spec-value" style="color: ${efficiencyColor}">${efficiency}%</div>
                                    <div class="spec-label">Ефективність</div>
                                </div>
                            </div>

                            <div style="margin-top: 15px;">
                                <div>📊 Середньо токенів: <strong>${Math.round(stats.avgTokensPerRequest)}</strong></div>
                                <div>❌ Відсоток помилок: <strong>${stats.errorRate}</strong></div>
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div class="stat-card"><div class="stat-title">ℹ️ Статистика відсутня</div><div>Поки що не було зроблено жодного запиту до моделей</div></div>';
            }

            // Recommendations
            if (report.recommendations && report.recommendations.length > 0) {
                html += '<h3>💡 Рекомендації</h3>';
                report.recommendations.forEach(rec => {
                    const iconMap = {
                        'PERFORMANCE': '🚀',
                        'RATE_LIMIT': '⏱️',
                        'EFFICIENCY': '📈'
                    };

                    html += `
                        <div class="stat-card">
                            <div class="stat-title">${iconMap[rec.type] || '💡'} ${rec.type}</div>
                            <div>${rec.message}</div>
                        </div>
                    `;
                });
            }

            resultsDiv.innerHTML = html;
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            // Show only the active tab content
            document.querySelectorAll('.tab-content').forEach((content, index) => {
                content.style.display = index === 0 ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
