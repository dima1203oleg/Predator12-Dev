name: Autogen Scan (scheduled)

on:
  schedule:
    - cron: '0 2 * * *' # daily at 02:00 UTC
  workflow_dispatch: {}

jobs:
  autogen-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run auto_propose dry-run
        run: |
          chmod +x scripts/auto_propose.sh
          ./scripts/auto_propose.sh || true

      - name: Upload auto-propose report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-propose-report
          path: ./.auto_propose_report.txt
