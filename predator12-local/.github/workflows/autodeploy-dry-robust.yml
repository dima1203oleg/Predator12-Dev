name: Autodeploy Dry-Run (robust)

on:
  workflow_dispatch:

jobs:
  dryrun:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MANIFESTS_REPO: ../manifests-temp
      IMAGE_TAG: dr-${{ github.run_id }}
      DRY_RUN: "1"
      AUTOSAVE_BRANCH: auto/autodeploy-tz
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Manual defensive checkout
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/dima1203oleg/Predator12-Dev"
          rm -rf .git || true
          git init
          git remote add origin "$REPO_URL"
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*" || true
          BRANCH="${{ github.ref_name }}"
          if [ -z "$BRANCH" ]; then
            BRANCH=main
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          else
            git checkout -B main refs/remotes/origin/main || true
          fi
          git fetch --no-tags --prune --unshallow || true
          if [ -f .gitmodules ]; then
            git config -f .gitmodules submodule.predator-manifests.url "https://github.com/dima1203oleg/predator-manifests.git" || true
          fi
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          mkdir -p ./scripts/tests || true
          if [ ! -f ./scripts/tests/gitops_sync_dry_tests.sh ]; then
            ln -sf ../gitops_sync_dry_tests.sh ./scripts/tests/gitops_sync_dry_tests.sh || true
          fi
          chmod +x ./scripts/gitops_sync_dry_tests.sh ./scripts/tests/gitops_sync_dry_tests.sh || true

      - name: "Defensive: ensure full checkout, submodules and shims"
        run: |
          # Try to unshallow the repo (idempotent)
          git fetch --no-tags --prune --unshallow || true
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          # Create test shim path and link to root shim if missing
          mkdir -p ./scripts/tests || true
          if [ ! -f ./scripts/tests/gitops_sync_dry_tests.sh ]; then
            if [ -f ./scripts/gitops_sync_dry_tests.sh ]; then
              ln -sf ./scripts/gitops_sync_dry_tests.sh ./scripts/tests/gitops_sync_dry_tests.sh || true
            elif [ -f ./gitops_sync_dry_tests.sh ]; then
              ln -sf ./gitops_sync_dry_tests.sh ./scripts/tests/gitops_sync_dry_tests.sh || true
            fi
          fi
          chmod +x ./scripts/gitops_sync_dry_tests.sh ./scripts/tests/gitops_sync_dry_tests.sh || true

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y yq jq shellcheck helm kubectl bats kind

      - name: Render Helm
        run: bash scripts/render_and_sync.sh || true

      - name: GitOps Dry-Run
        run: bash scripts/gitops_sync.sh || true

      - name: Run Dry Tests (tolerant)
        run: |
          set -euo pipefail
          candidates=(
            "$GITHUB_WORKSPACE/scripts/tests/gitops_sync_dry_tests.sh"
            "$GITHUB_WORKSPACE/scripts/gitops_sync_dry_tests.sh"
            "./scripts/tests/gitops_sync_dry_tests.sh"
            "./scripts/gitops_sync_dry_tests.sh"
          )
          found=""
          for c in "${candidates[@]}"; do
            if [ -f "$c" ]; then
              found="$c"
              break
            fi
          done
          if [ -n "$found" ]; then
            echo "Found dry-tests shim at: $found"
            chmod +x "$found" || true
            "$found" || true
          else
            echo "No dry-tests script found at expected paths; skipping dry tests."
          fi

      - name: Shellcheck
        run: shellcheck scripts/*.sh || true

      - name: Helm Lint
        run: helm lint helm/predator-umbrella --strict || true

      - name: Upload Logs
        uses: actions/upload-artifact@v4
        with:
          name: gitops-logs
          path: |
            ./.autodeploy/**
            test-*.log
