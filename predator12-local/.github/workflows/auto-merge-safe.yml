name: "Auto Merge - Safe"

on:
  pull_request_target:
    types: [labeled, opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (optional for manual dispatch)"
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  evaluate-and-merge:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || (github.event.label && github.event.label.name == 'autonomous/allow-auto-merge')
    env:
      MCP_THRESHOLD: 0.9
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install utils
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl

      - name: Trivy filesystem scan (optional)
        if: ${{ env.SKIP_SUPPLYCHAIN != 'true' && env.SKIP_SUPPLYCHAIN != '1' }}
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: fs
          format: "table"
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Cosign verify images (optional)
        if: ${{ env.SKIP_SUPPLYCHAIN != 'true' && env.SKIP_SUPPLYCHAIN != '1' && env.IMAGES_TO_VERIFY }}
        env:
          COSIGN_PUB: ${{ secrets.COSIGN_PUB || '' }}
        run: |
          set -euo pipefail
          if [ -z "${IMAGES_TO_VERIFY:-}" ]; then
            echo "[cosign] IMAGES_TO_VERIFY empty - skipping"
            exit 0
          fi
          for img in $(echo "$IMAGES_TO_VERIFY" | tr ',' ' '); do
            echo "[cosign] verify $img"
            if [ -n "$COSIGN_PUB" ]; then
              echo "$COSIGN_PUB" > /tmp/cosign.pub
              cosign verify --key /tmp/cosign.pub "$img"
            else
              cosign verify "$img" || (echo "cosign verify failed for $img" && exit 20)
            fi
          done

      - name: Run auto-merge condition checks
        env:
          GITHUB_TOKEN: ${{ secrets.AUTO_MERGE_BOT_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr_number }}
          SKIP_MCP: ${{ secrets.AUTO_MERGE_SKIP_MCP || 'false' }}
          SKIP_SUPPLYCHAIN: ${{ secrets.AUTO_MERGE_SKIP_SUPPLYCHAIN || 'true' }}
        run: |
          chmod +x scripts/auto_merge_condition_check.sh || true
          ./scripts/auto_merge_condition_check.sh

      - name: Merge PR (squash)
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.AUTO_MERGE_BOT_TOKEN || github.token }}
          script: |
            const pr = context.payload.pull_request || { number: parseInt(process.env.PR_NUMBER) };
            if (!pr || !pr.number) throw new Error('PR number not found');
            const { data } = await github.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash'
            });
            core.info('Merge result: ' + JSON.stringify(data));
