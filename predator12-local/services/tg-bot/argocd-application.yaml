apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: predator-tg-bot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/dima1203oleg/Predator12-Dev"
    targetRevision: main
    path: services/tg-bot/helm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: predator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
