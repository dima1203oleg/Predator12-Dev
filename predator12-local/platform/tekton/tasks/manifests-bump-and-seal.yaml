apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: manifests-bump-and-seal
spec:
  params:
    - name: image
  workspaces:
    - name: repo
  steps:
    - name: bump
      image: mikefarah/yq:4
      script: |
        #!/bin/sh
        set -e
        cd $(workspaces.repo.path)
        echo "Bumping manifests with image $(params.image)"
        yq -i ".image.tag = \"$(params.image)\"" charts/predator/values.yaml || true
    - name: seal
      image: bitnami/kubeseal:0.18.0
      script: |
        #!/bin/sh
        set -e
        echo "Sealing secrets (placeholder)"
        # kubeseal --format yaml < secret.yaml > sealedsecret.yaml
