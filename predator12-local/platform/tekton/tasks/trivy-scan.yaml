apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: trivy-scan
spec:
  params:
    - name: IMAGE
      type: string
  steps:
    - name: trivy
      image: aquasec/trivy:latest
      script: |
        trivy image --format json --output /workspace/output/trivy-report.json $(params.IMAGE) || true
    - name: upload-report
      image: bitnami/kubectl:latest
      script: |
        echo "Trivy report at /workspace/output/trivy-report.json"
  workspaces:
    - name: output
