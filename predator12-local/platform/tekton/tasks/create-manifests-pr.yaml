apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: create-manifests-pr
spec:
  params:
    - name: manifests-repo
      type: string
    - name: branch
      type: string
      default: "main"
    - name: image
      type: string
    - name: auto-merge
      type: string
      default: "0"
  workspaces:
    - name: source
  steps:
    - name: run-create-pr
      image: ubuntu:22.04
      script: |
        set -euo pipefail
        apt-get update >/dev/null 2>&1 || true
        apt-get install -y --no-install-recommends git curl ca-certificates >/dev/null 2>&1 || true
        chmod +x $(workspaces.source.path)/scripts/create-manifests-pr.sh || true
        MANIFESTS_REPO="$(params.manifests-repo)"
        BRANCH="$(params.branch)"
        IMAGE="$(params.image)"
        AUTO_MERGE="$(params.auto-merge)"
        export AUTO_MERGE
        $(workspaces.source.path)/scripts/create-manifests-pr.sh "$MANIFESTS_REPO" "$BRANCH" "$IMAGE"
