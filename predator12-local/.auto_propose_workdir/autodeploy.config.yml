autonomy:
  enabled: true
  autoPushWhenMcpConfidenceAbove: 0.85
  autopatchAutoApply: false
  autopatchConfidenceThreshold: 0.95
  allowAutoOverrideHighRisk: false
kill_switch:
  file_path: /var/run/autodeploy.disabled
verify:
  prometheus_url: http://prometheus-server.monitoring.svc.cluster.local
  err_rate_threshold: 0.005
  p95_threshold: 0.3
  uptime_threshold: 0.995
modes:
  default: staging
