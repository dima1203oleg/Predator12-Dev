name: Autodeploy Auto (scheduled / main push)
on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  push:
    branches:
      - main
jobs:
  run-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Manual defensive checkout (scheduled autodeploy)
        run: |
          set -euo pipefail
          REPO_URL="https://github.com/dima1203oleg/Predator12-Dev"
          rm -rf .git || true
          git init
          git remote add origin "$REPO_URL"
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*" || true
          BRANCH="${{ github.ref_name }}"
          if [ -z "$BRANCH" ]; then
            BRANCH=main
          fi
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          else
            git checkout -B main refs/remotes/origin/main || true
          fi
          git fetch --no-tags --prune --unshallow || true
          if [ -f .gitmodules ]; then
            git config -f .gitmodules submodule.predator-manifests.url "https://github.com/dima1203oleg/predator-manifests.git" || true
          fi
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
      - name: Run dry-run
        run: |
          bash scripts/render_and_sync.sh || true
          RUN_ID=ci-${{ github.run_id }} DRY_RUN=1 bash scripts/gitops_sync.sh || true
      - name: Call Autodeploy Controller
        env:
          AUTODEPLOY_ENDPOINT: ${{ secrets.AUTODEPLOY_ENDPOINT }}
          AUTODEPLOY_TOKEN: ${{ secrets.AUTODEPLOY_TOKEN }}
        run: |
          if [ -n "$AUTODEPLOY_ENDPOINT" ] && [ -n "$AUTODEPLOY_TOKEN" ]; then
            curl -fsS -X POST "$AUTODEPLOY_ENDPOINT/trigger" -H "Authorization: Bearer $AUTODEPLOY_TOKEN" -d '{"source":"github-scheduled"}' || true
          else
            echo "Autodeploy endpoint not configured"
          fi
