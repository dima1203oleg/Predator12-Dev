apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: predator-analytics-build-deploy
spec:
  params:
    - name: git-revision
      type: string
      description: The git revision (commit hash or tag) to build and deploy.
    - name: image-repository
      type: string
      description: The repository for the Docker image.
    - name: backend-image-tag
      type: string
      description: The tag for the backend Docker image.
    - name: frontend-image-tag
      type: string
      description: The tag for the frontend Docker image.
    - name: manifest-repo-url
      type: string
      description: URL of the Git repository containing Kubernetes manifests.
    - name: manifest-repo-branch
      type: string
      description: Branch of the Git repository containing Kubernetes manifests.
    - name: manifest-path
      type: string
      description: Path within the manifest repository for the Helm chart or K8s manifests.

  tasks:
    - name: checkout-source-code
      taskRef:
        name: git-clone # Using a common Tekton task for cloning
      params:
        - name: url
          value: "${{ github.event.repository.clone_url }}" # Assumes running from GitHub Actions context
        - name: revision
          value: "${{ params.git-revision }}"
        - name: subdirectory
          value: "source-code" # Clone into a subdirectory to keep things clean
      # This task will checkout the application source code

    - name: build-backend-image
      runAfter: ["checkout-source-code"]
      taskRef:
        name: build-docker-image # Assumes a custom task 'build-docker-image' exists or is defined elsewhere
      params:
        - name: path
          value: "source-code/backend" # Path to backend code within the cloned repo
        - name: imageUrl
          value: "${{ params.image-repository }}/predator-backend:${{ params.backend-image-tag }}"
      # This task builds the backend Docker image using Kaniko or similar

    - name: build-frontend-image
      runAfter: ["checkout-source-code"]
      taskRef:
        name: build-docker-image
      params:
        - name: path
          value: "source-code/frontend" # Path to frontend code within the cloned repo
        - name: imageUrl
          value: "${{ params.image-repository }}/predator-frontend:${{ params.frontend-image-tag }}"
      # This task builds the frontend Docker image

    - name: update-manifests
      runAfter: ["build-backend-image", "build-frontend-image"]
      taskRef:
        name: update-k8s-manifests # Assumes a custom task 'update-k8s-manifests' exists
      params:
        - name: manifestRepoUrl
          value: "${{ params.manifest-repo-url }}"
        - name: manifestRepoBranch
          value: "${{ params.manifest-repo-branch }}"
        - name: manifestPath
          value: "${{ params.manifest-path }}"
        - name: backendImageTag
          value: "${{ params.backend-image-tag }}"
        - name: frontendImageTag
          value: "${{ params.frontend-image-tag }}"
      # This task checks out the manifest repo, updates image tags (e.g., in Helm values.yaml),
      # and commits/pushes the changes back to the manifest repo.
