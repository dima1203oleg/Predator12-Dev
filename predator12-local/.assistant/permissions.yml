version: 1
allowed_actions:
  - id: helm-deploy
    description: Sync Helm-чартів через ArgoCD/Tekton
    environments: [dev, stage]
    namespaces: ["predator-dev","predator-stage"]
    charts:
      - name: platform/*
        max_version: "<=2.5.0"
  - id: enable-autoheal
    description: Увімкнути AutoHeal (Argo Rollouts, HPA, рестарти)
    namespaces: ["predator-*"]
  - id: run-local-daemon
    description: Запуск локальних сервісів (docker compose)
    hosts: ["macbook-pro","dev-node-*"]
    limits:
      max_runtime_minutes: 120
require_signed_commits: true
require_ci_pass: true
