version: 1
enabled: true
approver: "owner:dima"
scopes:
  - name: ci-cd
    actions: [build, test, scan, push-image, helm-deploy, argocd-sync, migrate-db]
    environments: [dev, stage]
  - name: data
    actions: [etl-run, reindex, vectorize, opensearch-refresh]
    datasets: [customs-8y, tax-5y, telegram, tenders]
guardrails:
  max_parallel_jobs: 6
  max_cluster_rps: 120
  cpu_quota_percent: 70
  gpu_quota: 1
  working_hours_utc: "00:00-23:59"
  allow_secrets_from: ["vault:kv/*", "sealed-secrets:*"]
  deny_plaintext_secrets: true
kill_switch:
  label: "ops:pause"
  file: ".assistant/PAUSE"
