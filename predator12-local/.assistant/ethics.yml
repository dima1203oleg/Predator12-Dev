lawful_use:
  - "Дані та код — лише з джерел, на які є права/ліцензії."
  - "Жодних персональних даних у відкритих артефактах."
  - "Жодних дій поза межами дозволених scopes/ RBAC."
content_policy:
  - "UI за замовчуванням українською; англійська — дубль."
  - "Відмова від NSFW/illegal контенту у тренувальних/демо датасетах."
security:
  - "Усі секрети через Vault/SOPS/SealedSecrets."
  - "Суворий SBOM + вразливості CVSS>=7 — блокують реліз."
stop_conditions:
  - id: legal-risk
    when: "license_scan.findings.high > 0"
    action: "halt_and_escalate"
  - id: security-critical
    when: "trivy.critical > 0 OR falco.incident == true"
    action: "halt_and_escalate"
  - id: perf-regression
    when: "benchmark.delta_p95_ms > 20%"
    action: "rollback_and_report"
  - id: cost-spike
    when: "cost.estimate.delta_daily > 30%"
    action: "throttle_and_report"
escalation:
  primary: "HumanInterventionAgent"
  notify: ["ops-telegram:webhook", "email:owner@predator.local"]
