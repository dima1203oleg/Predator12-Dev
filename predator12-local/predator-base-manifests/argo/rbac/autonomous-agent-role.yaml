apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-autonomous-deployer
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch", "sync", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-autonomous-deployer-binding
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-autonomous-deployer
subjects:
  - kind: ServiceAccount
    name: autonomous-agent
    namespace: argocd
