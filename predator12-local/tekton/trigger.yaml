# Tekton Trigger Configuration

# EventListener: Listens for incoming webhook events
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: predator-analytics-listener
spec:
  triggers:
    - name: github-push-trigger # Name for this specific trigger
      interceptors:
        # Interceptor to validate GitHub webhook signature and extract payload
        - github:
            secretRef: # Reference to a Kubernetes Secret containing the GitHub webhook secret
              secretName: github-webhook-secret # This secret needs to be created separately
        - gitlab: # Example for GitLab, if needed
            secretRef:
              secretName: gitlab-webhook-secret
      # TriggerTemplate defines how to create a PipelineRun from the event payload
      template:
        ref: predator-analytics-template # Reference to the TriggerTemplate defined below
        params:
          # Map parameters from the event payload to PipelineRun parameters
          - name: git-revision
            value: "$(body.after)" # For GitHub push events, 'after' is the commit SHA
          - name: image-repository
            value: "docker.io/your-docker-repo/predator-analytics" # Replace with your actual image repository
          - name: backend-image-tag
            value: "$(body.after)" # Use commit SHA as tag
          - name: frontend-image-tag
            value: "$(body.after)" # Use commit SHA as tag
          - name: manifest-repo-url
            value: "https://github.com/your-username/your-manifest-repo.git" # Replace with your manifest repo URL
          - name: manifest-repo-branch
            value: "main" # Or 'staging', 'prod', depending on your GitOps strategy
          - name: manifest-path
            value: "helm/predator-analytics" # Path to Helm chart in manifest repo

---
# TriggerBinding: Extracts data from the event payload
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: github-push-binding
spec:
  params:
    - name: git-revision # Parameter name for the TriggerTemplate
      value: "$(body.after)" # Extract commit SHA from GitHub push event payload
    - name: image-repository # Parameter name for the TriggerTemplate
      value: "docker.io/your-docker-repo/predator-analytics" # Replace with your actual image repository
    - name: backend-image-tag # Parameter name for the TriggerTemplate
      value: "$(body.after)" # Use commit SHA as tag
    - name: frontend-image-tag # Parameter name for the TriggerTemplate
      value: "$(body.after)" # Use commit SHA as tag
    - name: manifest-repo-url # Parameter name for the TriggerTemplate
      value: "https://github.com/your-username/your-manifest-repo.git" # Replace with your manifest repo URL
    - name: manifest-repo-branch # Parameter name for the TriggerTemplate
      value: "main" # Or 'staging', 'prod', depending on your GitOps strategy
    - name: manifest-path # Parameter name for the TriggerTemplate
      value: "helm/predator-analytics" # Path to Helm chart in manifest repo

---
# TriggerTemplate: Defines the PipelineRun resource to be created
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: predator-analytics-template
spec:
  params:
    # Define parameters that will be passed from TriggerBinding
    - name: git-revision
      description: The git revision (commit hash or tag) to build and deploy.
    - name: image-repository
      description: The repository for the Docker image.
    - name: backend-image-tag
      description: The tag for the backend Docker image.
    - name: frontend-image-tag
      description: The tag for the frontend Docker image.
    - name: manifest-repo-url
      description: URL of the Git repository containing Kubernetes manifests.
    - name: manifest-repo-branch
      description: Branch of the Git repository containing Kubernetes manifests.
    - name: manifest-path
      description: Path within the manifest repository for the Helm chart or K8s manifests.

  resourcetemplates:
    # Define the PipelineRun resource
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: predator-analytics-build-deploy-run- # Prefix for PipelineRun name
      spec:
        pipelineRef:
          name: predator-analytics-build-deploy # Reference to the Pipeline defined in pipeline.yaml
        params:
          # Pass parameters from the TriggerTemplate to the Pipeline
          - name: git-revision
            value: "${{ params.git-revision }}"
          - name: image-repository
            value: "${{ params.image-repository }}"
          - name: backend-image-tag
            value: "${{ params.backend-image-tag }}"
          - name: frontend-image-tag
            value: "${{ params.frontend-image-tag }}"
          - name: manifest-repo-url
            value: "${{ params.manifest-repo-url }}"
          - name: manifest-repo-branch
            value: "${{ params.manifest-repo-branch }}"
          - name: manifest-path
            value: "${{ params.manifest-path }}"
        # Service account for running the PipelineRun, needs permissions to clone repos, build images, etc.
        # serviceAccountName: tekton-sa
