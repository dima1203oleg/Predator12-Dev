# Tempo Configuration
server:
  http_listen_port: 3200
  log_level: info

metrics:
  enabled: true
  level: basic
  request_server: http

distributor:
  rate_limit_bytes: 52428800 # 50MB
  log_received_traces: false
  log_received_spans: false

ingester:
  trace_idle_period: 10s
  max_block_bytes: 3932160
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1

compactor:
  compaction:
    compacted_block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    blocklist_poll: 5m

querier:
  search:
    prefer_self: true
