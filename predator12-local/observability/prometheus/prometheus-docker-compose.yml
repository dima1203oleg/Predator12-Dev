# Prometheus configuration for Predator 12
# Usage: In docker-compose, mount this as prometheus.yml

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "predator-12"
    environment: "production"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

# Rule files
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Backend API
  - job_name: "backend-api"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s

  # Celery worker
  - job_name: "celery-worker"
    static_configs:
      - targets: ["celery-worker:8888"]
    metrics_path: "/metrics"

  # PostgreSQL
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis
  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Nginx/Proxy
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:9113"]

  # Node Exporter (system metrics)
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Qdrant vector database
  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6334"]
    metrics_path: "/metrics"

  # OpenSearch
  - job_name: "opensearch"
    static_configs:
      - targets: ["opensearch-exporter:9114"]
