apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: predator-analytics-backend
  namespace: predator-analytics-production
  labels:
    app: predator-analytics
    component: backend
spec:
  selector:
    matchLabels:
      app: predator-analytics
      component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: predator-analytics-agents
  namespace: predator-analytics-production
  labels:
    app: predator-analytics
    component: agents
spec:
  selector:
    matchLabels:
      app: predator-analytics
      component: agents
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
