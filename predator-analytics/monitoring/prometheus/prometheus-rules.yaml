apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: predator-analytics-slo
  namespace: predator-analytics-production
  labels:
    app: predator-analytics
    prometheus: kube-prometheus
spec:
  groups:
    - name: predator_analytics_slo
      interval: 30s
      rules:
        # API Latency SLO: 95% of requests < 200ms
        - record: predator:api:latency:p95
          expr: histogram_quantile(0.95, rate(predator_http_request_duration_seconds_bucket[5m]))

        - record: predator:api:latency:p99
          expr: histogram_quantile(0.99, rate(predator_http_request_duration_seconds_bucket[5m]))

        - alert: APILatencyHigh
          expr: predator:api:latency:p95 > 0.2
          for: 5m
          labels:
            severity: warning
            component: backend
          annotations:
            summary: "API latency is high"
            description: "95th percentile latency is {{ $value }}s (SLO: <200ms)"

        # Request Success Rate SLO: 99.9% success rate
        - record: predator:api:success_rate
          expr: |
            sum(rate(predator_http_requests_total{status!~"5.."}[5m])) /
            sum(rate(predator_http_requests_total[5m]))

        - alert: APISuccessRateLow
          expr: predator:api:success_rate < 0.999
          for: 5m
          labels:
            severity: critical
            component: backend
          annotations:
            summary: "API success rate is below SLO"
            description: "Success rate is {{ $value | humanizePercentage }} (SLO: >99.9%)"

        # Celery Queue Length
        - record: predator:celery:queue_length
          expr: predator_celery_queue_length

        - alert: CeleryQueueBacklog
          expr: predator:celery:queue_length > 100
          for: 10m
          labels:
            severity: warning
            component: celery
          annotations:
            summary: "Celery queue has backlog"
            description: "Queue length is {{ $value }} tasks"

        # Task Execution Time
        - record: predator:tasks:execution_time:p95
          expr: histogram_quantile(0.95, rate(predator_task_execution_seconds_bucket[5m]))

        - alert: TaskExecutionSlow
          expr: predator:tasks:execution_time:p95 > 60
          for: 10m
          labels:
            severity: warning
            component: agents
          annotations:
            summary: "Task execution is slow"
            description: "95th percentile execution time is {{ $value }}s"

        # Redis Availability SLO: >99.9% uptime
        - record: predator:redis:availability
          expr: |
            sum(rate(predator_redis_operations_total{status="success"}[5m])) /
            sum(rate(predator_redis_operations_total[5m]))

        - alert: RedisAvailabilityLow
          expr: predator:redis:availability < 0.999
          for: 5m
          labels:
            severity: critical
            component: redis
          annotations:
            summary: "Redis availability is below SLO"
            description: "Availability is {{ $value | humanizePercentage }} (SLO: >99.9%)"

        # Agent Errors
        - alert: AgentErrorRateHigh
          expr: rate(predator_agent_errors_total[5m]) > 0.1
          for: 5m
          labels:
            severity: warning
            component: agents
          annotations:
            summary: "Agent error rate is high"
            description: "Error rate for {{ $labels.agent_type }} is {{ $value | humanize }} errors/s"
