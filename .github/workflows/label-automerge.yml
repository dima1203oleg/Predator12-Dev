name: Label PR for automerge
on:
  pull_request_target:
    types: [opened]
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Add label if safe size
        uses: actions-ecosystem/action-add-labels@v1
        if: ${{ github.event.pull_request.additions < 1200 && github.event.pull_request.changed_files < 60 }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: automerge
