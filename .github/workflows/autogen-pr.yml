name: Autogen — create PR from suggestions (template)

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run auto_propose generator
        run: |
          chmod +x scripts/auto_propose.sh
          ./scripts/auto_propose.sh || true

      - name: Check for suggested.patch
        id: checkpatch
        run: |
          if [ -f suggested.patch ]; then
            echo "found=true" > patch_exists.txt
            echo "Patch exists"
          else
            echo "found=false" > patch_exists.txt
            echo "No patch"
          fi
          cat patch_exists.txt

      - name: Create PR from patch
        if: steps.checkpatch.outputs.found != 'false' || always()
        run: |
          if [ -f suggested.patch ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b autogen/suggested-$(date +%s)
            git apply suggested.patch
            git add -A
            git commit -m "chore: apply auto-suggested patch"
            git push --set-upstream origin HEAD
            echo "PR branch pushed. Creating PR via GitHub Action..."
          else
            echo "No suggested.patch; nothing to do."
          fi

      - name: Create pull request (if branch exists)
        if: github.ref == 'refs/heads/main' || always()
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: apply auto-suggested patch"
          branch: "autogen/suggested-branch"
          title: "Auto-generated suggestions"
          body: |
            This PR was created by the autogen pipeline in safe mode. It contains suggested changes from the project's auto-propose agent.
          labels: autogenerated
