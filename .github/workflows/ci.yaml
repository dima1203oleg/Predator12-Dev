name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || true
      - name: Run backend tests
        run: |
          pytest backend/tests/ -q --maxfail=1 || true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install frontend deps
        run: |
          if [ -d frontend ]; then npm --prefix frontend ci; fi
      - name: Run frontend tests
        run: |
          if [ -d frontend ]; then npm --prefix frontend test --if-present || true; fi
      - name: Build frontend
        run: |
          if [ -d frontend ]; then npm --prefix frontend run build --if-present || true; fi
